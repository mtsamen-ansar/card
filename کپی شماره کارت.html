<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کپی شماره کارت</title>
<style>
:root{--bg:#f3f6f4;--card:#ffffff;--ink:#14302a;--sub:#5b7069;--accent:#0f766e;--accent-ink:#ffffff;--line:#d5e0db;color-scheme:light dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a17;--card:#162622;--ink:#e7f2ee;--sub:#9db3ab;--accent:#2dd4bf;--accent-ink:#06211d;--line:#27403a}}
:root[data-theme="dark"]{--bg:#0e1a17;--card:#162622;--ink:#e7f2ee;--sub:#9db3ab;--accent:#2dd4bf;--accent-ink:#06211d;--line:#27403a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 22px;width:100%;max-width:380px;text-align:center}
p{margin:0 0 14px;color:var(--sub);font-size:15px}
.num{direction:ltr;font-size:26px;font-weight:700;letter-spacing:1.5px;margin:6px 0 22px;font-variant-numeric:tabular-nums;word-break:break-all}
button{width:100%;font:inherit;font-size:17px;font-weight:700;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#msg{min-height:22px;margin:14px 0 0;color:var(--accent);font-size:15px}
</style>
</head>
<body>
<div class="box">
<p>شماره کارت</p>
<div class="num" id="n">6219 8619 1008 4002</div>
<button id="b" type="button">کپی شماره کارت</button>
<div id="msg" role="status"></div>
</div>
<script>
var raw="6219861910084002";
var msg=document.getElementById("msg");
function done(ok){msg.textContent=ok?"کپی شد":"کپی نشد؛ شماره را نگه دارید و کپی کنید";}
function fallback(){
  var t=document.createElement("textarea");t.value=raw;t.setAttribute("readonly","");
  t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();
  var ok=false;try{ok=document.execCommand("copy");}catch(e){}
  document.body.removeChild(t);done(ok);
}
document.getElementById("b").addEventListener("click",function(){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(raw).then(function(){done(true);},fallback);
    }else{fallback();}
  }catch(e){fallback();}
});
</script>
</body>
</html>
